[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["episodes", "Images", "log", "qwen3.6-27b-4bit", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts bootstrap sys.path before importing project modules.
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
